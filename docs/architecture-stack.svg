<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg"
     font-family="Arial, Helvetica, sans-serif"
     role="img" aria-labelledby="title desc">
  <title id="title">S3 Connector for PyTorch Architecture Stack</title>
  <desc id="desc">Architecture showing Python layer on top flowing down to PyO3, Rust, C, and S3 layers below</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#2563eb"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="10" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Architecture Stack</text>

  <!-- ===== Top: Python (s3torchconnector) — full width ===== -->
  <rect x="20" y="40" width="860" height="330" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">s3torchconnector — Python</text>

  <!-- Left column: User-facing APIs (stacked vertically) -->
  <text x="40" y="82" font-size="9" fill="#64748b">User-facing APIs</text>

  <rect x="40" y="88" width="170" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">S3MapDataset</text>

  <rect x="40" y="120" width="170" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="137" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">S3IterableDataset</text>

  <rect x="40" y="152" width="170" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">S3Checkpoint</text>

  <rect x="40" y="184" width="170" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="125" y="201" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">S3LightningCheckpoint</text>

  <!-- Middle-right: DCP -->
  <text x="430" y="82" font-size="9" fill="#64748b">Distributed Checkpointing (DCP)</text>

  <rect x="430" y="88" width="140" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="500" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">S3StorageWriter</text>

  <rect x="585" y="88" width="140" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="655" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">S3StorageReader</text>

  <rect x="460" y="130" width="235" height="28" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="577" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">S3FileSystem</text>

  <!-- Arrows: DCP -> S3FileSystem -->
  <line x1="500" y1="114" x2="540" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="655" y1="114" x2="615" y2="128" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Arrow: S3FileSystem -> S3Client -->
  <line x1="577" y1="158" x2="400" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Far right: I/O Streams -->
  <text x="680" y="195" font-size="9" fill="#64748b">I/O Streams</text>

  <rect x="680" y="202" width="160" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="760" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">S3Reader</text>

  <rect x="680" y="234" width="160" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="760" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">S3Writer</text>

  <text x="680" y="274" font-size="9" fill="#64748b">Sequential | Ranged | DCPOptimized</text>

  <!-- S3Client (center-bottom of Python layer) -->
  <rect x="250" y="260" width="250" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">S3Client</text>
  <text x="375" y="294" text-anchor="middle" font-size="10" fill="#64748b">fork-safe, lazy init</text>

  <!-- Arrows: Left APIs -> S3Client -->
  <line x1="210" y1="101" x2="260" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="210" y1="133" x2="265" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="210" y1="165" x2="270" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="210" y1="197" x2="275" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Arrows: S3Client -> S3Reader/Writer (dashed) -->
  <line x1="500" y1="275" x2="678" y2="215" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <line x1="500" y1="285" x2="678" y2="247" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- ===== Bottom row: PyO3 → Rust → C → S3 ===== -->
  <!-- Arrow: S3Client -> PyO3 (on left side, doesn't cross header text) -->
  <line x1="250" y1="302" x2="145" y2="400" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- PyO3 Bridge -->
  <rect x="20" y="390" width="250" height="170" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="145" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">s3torchconnectorclient — PyO3</text>

  <rect x="35" y="422" width="220" height="32" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="145" y="442" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">MountpointS3Client</text>

  <rect x="35" y="464" width="68" height="24" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="69" y="480" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">GetObject</text>

  <rect x="111" y="464" width="68" height="24" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="145" y="480" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">PutObject</text>

  <rect x="187" y="464" width="68" height="24" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="221" y="480" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">ListObject</text>

  <text x="145" y="502" text-anchor="middle" font-size="9" fill="#92400e">Stream</text>

  <!-- Arrow: MountpointS3Client -> Streams -->
  <line x1="145" y1="454" x2="145" y2="462" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Rust -->
  <rect x="290" y="390" width="180" height="170" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">mountpoint-s3-client</text>
  <text x="380" y="424" text-anchor="middle" font-size="10" fill="#64748b">Rust</text>

  <rect x="305" y="440" width="150" height="35" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="380" y="462" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Streaming S3 GET / PUT / LIST</text>

  <!-- Arrow: PyO3 -> Rust -->
  <line x1="272" y1="457" x2="303" y2="457" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- C (AWS CRT) -->
  <rect x="490" y="390" width="170" height="170" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="575" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">AWS CRT</text>
  <text x="575" y="424" text-anchor="middle" font-size="10" fill="#64748b">C</text>

  <rect x="505" y="440" width="140" height="35" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="575" y="462" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">HTTP, TLS, DNS, S3</text>

  <!-- Arrow: Rust -> CRT -->
  <line x1="457" y1="457" x2="503" y2="457" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Amazon S3 -->
  <rect x="680" y="390" width="200" height="170" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="780" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Amazon S3</text>
  <text x="780" y="424" text-anchor="middle" font-size="10" fill="#64748b">Cloud Storage</text>

  <rect x="700" y="440" width="160" height="35" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="780" y="462" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Object Storage</text>

  <!-- Arrow: CRT -> S3 -->
  <line x1="647" y1="457" x2="698" y2="457" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Footer -->
  <text x="450" y="575" text-anchor="middle" font-size="10" fill="#64748b">10+ Gbps throughput via AWS Common Runtime</text>
</svg>
